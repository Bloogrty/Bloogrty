  .value { font: 600 13px 'Segoe UI', Ubuntu, sans-serif; fill: #1f2328; }
  .big   { font: 700 26px 'Segoe UI', Ubuntu, sans-serif; fill: #1f2328; }
  .rule  { stroke: #d0d7de; }
